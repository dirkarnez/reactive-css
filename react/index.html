<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap-reboot.min.css" rel="stylesheet">
</head>
<body>
    <div id="app"></div>
	
    <script type="text/babel">
      function Application() {
        const [ isEven, setIsEven ] = React.useState(true);

        const styleRef = React.useRef(null);

        const reativeStyle = isEven => `
        table {
          border-collapse: collapse;
          width: 100%;
        }
        
        th, td {
          text-align: left;
          padding: 8px;
        }

        tr:nth-child(${isEven ? "even" : "odd"}) {
          background-color: #D6EEEE;
        }
        `

        React.useEffect(() => {
          styleRef.current.innerHTML = reativeStyle(isEven);
        }, [ isEven ]);
        
        return (
          <React.Fragment>
            <style ref={ styleRef } />
            <table>
				<thead>
					<tr>
						<th>First Name</th>
						<th>Last Name</th>
						<th>Points</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>Peter</td>
						<td>Griffin</td>
						<td>$100</td>
					</tr>
					<tr>
						<td>Lois</td>
						<td>Griffin</td>
						<td>$150</td>
					</tr>
					<tr>
						<td>Joe</td>
						<td>Swanson</td>
						<td>$300</td>
					</tr>
					<tr>
						<td>Cleveland</td>
						<td>Brown</td>
						<td>$250</td>
					</tr>
				</tbody>
            </table>
            
            <button onClick={() => {  setIsEven(!isEven) }}>Reactive css</button>
          </React.Fragment>
        )
      }
	  ReactDOM.createRoot(document.getElementById('app')).render(<Application />);
    </script>
    <script src="https://unpkg.com/react@18.1.0/umd/react.development.js"></script>
    <!-- https://unpkg.com/react@18.2.0/umd/react.production.min.js -->
    <script src="https://unpkg.com/react-dom@18.1.0/umd/react-dom.development.js"></script>
    <!-- https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js -->
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>
</body>
</html>
